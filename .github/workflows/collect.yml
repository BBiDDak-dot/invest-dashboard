name: collect

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 16:40 KST, 국내장 마감 후
    - cron: "30 21 * * 1-5"  # 06:30 KST, 미국장 마감 후
  workflow_dispatch:
    inputs:
      days:
        description: "며칠 전부터 수집할지 (처음 1회는 1000 추천)"
        default: "10"

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r requirements.txt
      - run: python main.py --days "${{ github.event.inputs.days || 10 }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # 없으면 산업 클리핑은 키워드 규칙으로 분류
