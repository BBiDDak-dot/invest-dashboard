name: collect

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 16:40 KST, 국내장 마감 후
    - cron: "30 21 * * 1-5"  # 06:30 KST, 미국장 마감 후
  workflow_dispatch:
    inputs:
      days:
        description: "며칠 전부터 수집할지 (처음 1회는 1000 추천)"
        default: "10"
      only:
        description: "이 수집기만 실행 (예: PBR 밴드). 비우면 전체"
        default: ""

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r requirements.txt
      - run: python main.py --days "${{ github.event.inputs.days || 10 }}" --only "${{ github.event.inputs.only }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # 없으면 산업 클리핑은 키워드 규칙으로 분류
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  # 없으면 OpenRouter 토큰 지표만 건너뜀
      - run: python notify.py  # 내 종목 공시·실적 스크리닝 새 종목을 텔레그램으로
        if: always() && !github.event.inputs.only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
